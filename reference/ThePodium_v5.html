<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Podium v5 — Voices of the Continent &amp; the Diaspora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Warm light — sun, sand, clay, indigo */
  --bg: #F6EEDF; --surface: #FFFDF6; --elevated: #F1E4CB;
  --border: #E3D5BC; --border-light: #CBB68F;
  --amber: #C05A2E;        /* clay — primary accent */
  --amber-dim: #8A5B2B;    /* deep gold-brown */
  --amber-faint: #F6E3D3;  /* pale clay tint */
  --accent-border: #DFC3A9; --accent-tint: #F3E0CE;
  --gold: #C99A3C;
  --terra: var(--terra); --terra-tint: #F0DAC8; --terra-border: #D9A87E;
  --green: #55754A; --green-tint: #E4E8D8; --green-border: #AFC19A;
  --blue: #2F4A6B; --blue-tint: #DFE5EC; --blue-border: #9FB2C8;
  --purple: #6F55A0; --purple-tint: #E9E2F0; --purple-border: #C0AFD6;
  --gray-tint: #EDE8DC; --gray-border: #C8BFA9; --gray-text: #6F6A5C;
  --text: #2A1E12; --text-muted: #6B573D; --text-dim: #8F7856;
  --red: #B03A2E; --red-tint: #F4DCD6; --red-border: #DBA095;
  --warn-tint: #F8ECD2; --warn-border: #D9B36A; --warn-text: #7A5410; --warn-text2: #9A6E1D;
  --wa: #178F4E;
  --overlay: rgba(42,30,18,0.55);
  --nav-bg: rgba(246,238,223,0.92);
  --on-primary: #FFF6EA;
}
html[data-theme="dark"] {
  /* Warm dark — clay-brown, not cold charcoal */
  --bg: #1A130C; --surface: #241B11; --elevated: #2F2416;
  --border: #3C2F1E; --border-light: #4E3E28;
  --amber: #E08A54; --amber-dim: #C99A3C; --amber-faint: #33220F;
  --accent-border: #5A4023; --accent-tint: #3A2A15;
  --gold: #C99A3C;
  --terra: #D97E4A; --terra-tint: #3A2415; --terra-border: #6E4526;
  --green: #8FAE7C; --green-tint: #22301B; --green-border: #4A6238;
  --blue: #8FAECB; --blue-tint: #1D2A3A; --blue-border: #3D5878;
  --purple: #B49FD8; --purple-tint: #2A2138; --purple-border: #584775;
  --gray-tint: #2C2A24; --gray-border: #57534A; --gray-text: #9B968A;
  --text: #F2E8D5; --text-muted: #C4B296; --text-dim: #8A7A5F;
  --red: #E06A5C; --red-tint: #3A1F1B; --red-border: #7A3B32;
  --warn-tint: #3A2E12; --warn-border: #8A6A22; --warn-text: #E8C878; --warn-text2: #C9A855;
  --wa: #4FCE7E;
  --overlay: rgba(8,5,3,0.78);
  --nav-bg: rgba(26,19,12,0.93);
  --on-primary: #1A130C;
}
#kente{position:fixed;top:0;left:0;right:0;height:5px;display:flex;z-index:110;}
#kente div{height:100%;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
input,textarea,select,button{font-family:'Outfit',sans-serif;}
input,textarea,select{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);font-size:14px;width:100%;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent-border);}
textarea{resize:vertical;}
a{color:var(--amber);text-decoration:none;}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

.fade-in{animation:fadeIn .24s ease both;}
.pulse{animation:pulse 2s infinite;}
.sk{background:linear-gradient(90deg,var(--surface) 25%,var(--elevated) 50%,var(--surface) 75%);background-size:1200px 100%;animation:shimmer 1.8s infinite;border-radius:4px;}

/* Nav */
#nav{position:fixed;top:5px;left:0;right:0;height:54px;background:var(--nav-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100;}
.nav-logo{cursor:pointer;display:flex;align-items:center;gap:0;position:relative;padding:8px 18px;flex-shrink:0;}
.nav-logo-text{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--text);}
.nav-logo-corner{position:absolute;width:14px;height:14px;border-color:var(--amber);}
.nav-logo-corner.tl{top:0;left:0;border-top:2px solid;border-left:2px solid;}
.nav-logo-corner.br{bottom:0;right:0;border-bottom:2px solid;border-right:2px solid;}
#nav-links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
#nav-links::-webkit-scrollbar{display:none;}
.nav-link{padding:5px 10px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text-muted);white-space:nowrap;transition:background .15s,color .15s;border:none;background:transparent;}
.nav-link:hover{color:var(--text);}
.nav-link.active{color:var(--amber);background:var(--amber-faint);}
.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 18px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s,transform .1s;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--amber);color:var(--on-primary);}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn-ghost{background:transparent;color:var(--text-muted);}
.btn-muted{background:var(--elevated);color:var(--text-muted);border:1px solid var(--border);}
.btn-amber{background:var(--amber-faint);color:var(--amber);border:1px solid var(--accent-border);}
.btn-danger{background:var(--red-tint);color:var(--red);border:1px solid var(--red-border);}
.btn-success{background:var(--green-tint);color:var(--green);border:1px solid var(--green-border);}
.btn-sm{padding:5px 12px;font-size:12px;}
.btn-lg{padding:11px 24px;font-size:15px;}
.btn-full{width:100%;}
.btn-wa{background:var(--green-tint);color:var(--wa);border:1px solid var(--green-border);}

/* Badges */
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;border-radius:3px;padding:2px 6px;letter-spacing:.04em;border:1px solid transparent;}
.badge-verified{color:var(--amber);background:var(--amber-faint);border-color:var(--accent-border);}
.badge-blogger{color:var(--amber-dim);background:var(--accent-tint);border-color:var(--accent-border);}
.badge-news-agency{color:var(--blue);background:var(--blue-tint);border-color:var(--blue-border);}
.badge-reader{color:var(--green);background:var(--green-tint);border-color:var(--green-border);}
.badge-continent{color:var(--green);background:var(--green-tint);border-color:var(--green-border);}
.badge-diaspora{color:var(--blue);background:var(--blue-tint);border-color:var(--blue-border);}
.badge-founding{color:var(--terra);background:var(--terra-tint);border-color:var(--terra-border);}
.badge-draft{color:var(--amber-dim);background:var(--amber-faint);border-color:var(--accent-border);}
.badge-published{color:var(--green);background:var(--green-tint);border-color:var(--green-border);}
.badge-archived{color:var(--text-dim);background:var(--elevated);border-color:#56504440;}
.badge-series{color:var(--purple);background:var(--purple-tint);border-color:var(--purple-border);}
.badge-poll{color:var(--blue);background:var(--blue-tint);border-color:var(--blue-border);}

/* Trust badges */
.trust-1{color:var(--gray-text);background:var(--gray-tint);border-color:var(--gray-border);}
.trust-2{color:var(--blue);background:var(--blue-tint);border-color:var(--blue-border);}
.trust-3{color:var(--green);background:var(--green-tint);border-color:var(--green-border);}
.trust-4{color:var(--amber-dim);background:var(--accent-tint);border-color:var(--accent-border);}
.trust-5{color:var(--terra);background:var(--terra-tint);border-color:var(--terra-border);}

/* Layout */
.wrap{max-width:780px;margin:0 auto;padding:74px 20px 60px;}
.wrap-wide{max-width:1000px;margin:0 auto;padding:74px 20px 60px;}
.section-title{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;}
.section-title h1{font-family:'Fraunces',serif;font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px;}
.section-title p{font-size:14px;color:var(--text-muted);}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;}
.card-lg{border-radius:12px;padding:26px;}
.card:hover:not(.no-hover){border-color:var(--border-light);background:var(--elevated);}
.card-click{cursor:pointer;transition:border-color .15s,background .15s;}

/* Avatar */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;}

/* Tags */
.tag{display:inline-flex;font-size:11px;font-weight:500;color:var(--amber-dim);background:var(--amber-faint);border:1px solid var(--accent-border);border-radius:4px;padding:2px 7px;text-transform:lowercase;}

/* Divider */
.divider{height:1px;background:var(--border);margin:16px 0;}

/* Form group */
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;display:block;}

/* Overlay / Modal */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;animation:fadeIn .2s ease;}

/* Toast */
#toast{position:fixed;bottom:24px;right:24px;z-index:400;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;max-width:340px;animation:toastIn .2s ease;box-shadow:0 4px 24px rgba(42,30,18,.22);pointer-events:none;}
.toast-success{background:var(--green-tint);border:1px solid var(--green-border);color:var(--green);}
.toast-info{background:var(--elevated);border:1px solid var(--border);color:var(--text);}
.toast-error{background:var(--red-tint);border:1px solid var(--red-border);color:var(--red);}

/* Skeleton */
.sk-card{padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;}

/* Notif dropdown */
#notif-panel{position:absolute;right:0;top:calc(100% + 8px);width:310px;background:var(--surface);border:1px solid var(--border);border-radius:10px;z-index:150;max-height:380px;overflow-y:auto;box-shadow:0 8px 32px rgba(42,30,18,.22);animation:slideDown .18s ease;}
.notif-item{padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
.notif-item:last-child{border-bottom:none;}
.notif-item.unread{background:var(--accent-tint);}
.notif-text{font-size:13px;color:var(--text);margin-bottom:2px;}
.notif-time{font-size:11px;color:var(--text-dim);}

/* Category bar */
.cat-bar{display:flex;gap:6px;overflow-x:auto;margin-bottom:20px;padding-bottom:4px;scrollbar-width:none;}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-pill{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;}
.cat-pill.active{border-color:var(--amber);background:var(--amber-faint);color:var(--amber);}

/* Rich toolbar */
.rich-toolbar{display:flex;gap:4px;padding:5px 10px;background:var(--elevated);border-radius:6px 6px 0 0;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;}
.tb-btn{padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;min-width:28px;}
.tb-btn:hover{background:var(--elevated);color:var(--text);}
.rich-ta{border-radius:0 0 6px 6px!important;border-top:none!important;}

/* Poll widget */
.poll-bar-outer{height:6px;border-radius:3px;background:var(--border);overflow:hidden;cursor:pointer;margin-top:4px;}
.poll-bar-inner{height:100%;border-radius:3px;transition:width .4s;}

/* Onboarding */
.ob-option{background:var(--elevated);border:1.5px solid var(--border);border-radius:10px;padding:14px 18px;cursor:pointer;text-align:left;display:flex;gap:14px;align-items:center;transition:border-color .15s,background .15s;width:100%;}
.ob-option:hover,.ob-option.selected{border-color:var(--amber);background:var(--amber-faint);}

/* Feed toggle */
.feed-toggle{display:flex;gap:4px;background:var(--elevated);border-radius:20px;padding:3px;}
.ft-btn{padding:5px 12px;border-radius:16px;border:none;background:transparent;color:var(--text-muted);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;}
.ft-btn.active{background:var(--surface);color:var(--amber);}

/* Expertise chips */
.ex-chip{display:inline-flex;align-items:center;gap:8px;background:var(--elevated);border:1px solid var(--border);border-radius:6px;padding:6px 12px;}

/* Scroll to top */
body:has(.wrap){padding-top:0;}

/* Responsive helpers */
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.score-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;}
.score-val{font-size:22px;font-weight:600;margin-bottom:3px;}
.score-lbl{font-size:11px;color:var(--text-dim);}

@media(max-width:640px){
  #nav-links{display:none;}
  .wrap{padding:70px 14px 50px;}
  #hamburger{display:flex!important;}
}
#hamburger{display:none;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text-muted);font-size:15px;cursor:pointer;}
#mobile-menu{position:fixed;top:59px;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);z-index:99;padding:8px 12px;display:none;animation:slideDown .18s ease;box-shadow:0 12px 32px rgba(42,30,18,.22);}
#mobile-menu .nav-link{display:block;padding:11px 12px;font-size:14px;border-bottom:1px solid var(--border);border-radius:0;}
#mobile-menu .nav-link:last-child{border-bottom:none;}

/* Reading progress */
#read-progress{position:fixed;top:59px;left:0;height:2.5px;background:var(--amber);z-index:120;width:0;transition:width .1s linear;}

/* Toast action */
#toast{pointer-events:auto;display:none;align-items:center;gap:12px;}
.toast-undo{background:transparent;border:1px solid currentColor;color:inherit;border-radius:5px;padding:3px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;}

/* Messages */
.dm-layout{display:flex;gap:16px;align-items:flex-start;}
.dm-list{width:250px;flex-shrink:0;}
.dm-item{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent;}
.dm-item:hover{background:var(--elevated);}
.dm-item.active{background:var(--amber-faint);border-color:var(--accent-border);}
.dm-thread{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;min-height:420px;max-height:65vh;}
.dm-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;}
.bubble{max-width:75%;padding:9px 14px;border-radius:14px;font-size:14px;line-height:1.55;}
.bubble.me{align-self:flex-end;background:var(--amber-faint);color:var(--text);border:1px solid var(--accent-border);border-bottom-right-radius:4px;}
.bubble.them{align-self:flex-start;background:var(--elevated);color:var(--text-muted);border-bottom-left-radius:4px;}
.bubble-time{font-size:10px;color:var(--text-dim);margin-top:3px;}
@media(max-width:700px){.dm-layout{flex-direction:column;}.dm-list{width:100%;}}

/* Group board */
.gpost{background:var(--elevated);border-radius:8px;padding:14px;margin-bottom:10px;}

/* Reply thread */
.reply-block{margin-left:34px;margin-top:8px;padding-left:14px;border-left:2px solid var(--border);}

</style>
</head>
<body>

<!-- NAV -->
<div id="kente" aria-hidden="true">
  <div style="flex:3;background:#C99A3C"></div><div style="flex:1;background:#2A1E12"></div><div style="flex:2;background:#C05A2E"></div><div style="flex:1;background:#55754A"></div><div style="flex:2;background:#2F4A6B"></div><div style="flex:1;background:#2A1E12"></div><div style="flex:3;background:#C99A3C"></div><div style="flex:2;background:#C05A2E"></div><div style="flex:1;background:#55754A"></div><div style="flex:2;background:#2F4A6B"></div><div style="flex:1;background:#2A1E12"></div><div style="flex:3;background:#C99A3C"></div>
</div>
<nav id="nav">
  <div style="display:flex;align-items:center;gap:12px;">
    <button id="hamburger" onclick="toggleMobileMenu()">☰</button>
    <div class="nav-logo" onclick="navigate('landing')" title="The Podium">
      <div class="nav-logo-corner tl"></div>
      <div class="nav-logo-corner br"></div>
      <span class="nav-logo-text">THE PODIUM</span>
    </div>
    <div id="nav-links"></div>
  </div>
  <div class="nav-actions" id="nav-actions"></div>
</nav>
<div id="mobile-menu"></div>
<div id="read-progress"></div>

<!-- Main -->
<main id="app"></main>

<!-- Toast -->
<div id="toast" style="display:none"></div>

<script>
// ─── Utils ────────────────────────────────────────────────────────────────────
const hashPw=s=>{let h=0;for(let i=0;i<s.length;i++)h=Math.imul(31,h)+s.charCodeAt(i)|0;return(h>>>0).toString(16);};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const T=d=>new Date(Date.now()-d*86400000).toISOString();
const ago=d=>{const s=(Date.now()-new Date(d))/1000;if(s<60)return"just now";if(s<3600)return`${Math.floor(s/60)}m ago`;if(s<86400)return`${Math.floor(s/3600)}h ago`;return`${Math.floor(s/86400)}d ago`;};
const fmtDate=d=>new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const wc=t=>t.trim().split(/\s+/).filter(Boolean).length;
const readTime=t=>`${Math.max(1,Math.ceil(wc(t)/200))} min`;
const validatePw=pw=>{if(pw.length<10)return"Min 10 characters";if(!/[A-Z]/.test(pw))return"Need an uppercase letter";if(!/[0-9\W_]/.test(pw))return"Need a number or symbol";return null;};
const escHtml=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function renderMd(raw){
  if(!raw)return"";
  let h=raw.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const lines=h.split("\n");const out=[];let inUl=false;
  for(const line of lines){
    if(/^## /.test(line)){if(inUl){out.push("</ul>");inUl=false;}out.push(`<h2 style="font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--text);margin:20px 0 8px;line-height:1.3">${line.slice(3)}</h2>`);}
    else if(/^### /.test(line)){if(inUl){out.push("</ul>");inUl=false;}out.push(`<h3 style="font-size:16px;font-weight:600;color:var(--text);margin:14px 0 6px">${line.slice(4)}</h3>`);}
    else if(/^&gt; /.test(line)){if(inUl){out.push("</ul>");inUl=false;}out.push(`<blockquote style="border-left:3px solid var(--amber);padding:6px 0 6px 16px;margin:12px 0;color:var(--text-muted);font-style:italic;line-height:1.7">${line.slice(5)}</blockquote>`);}
    else if(/^[-*] /.test(line)){if(!inUl){out.push(`<ul style="padding-left:18px;margin:8px 0">`);inUl=true;}out.push(`<li style="margin:5px 0;color:var(--text-muted);line-height:1.65">${line.slice(2)}</li>`);}
    else{if(inUl){out.push("</ul>");inUl=false;}out.push(line===""?`<div style="height:8px"></div>`:`<p style="margin:0 0 12px;color:var(--text-muted);line-height:1.85">${line}</p>`);}
  }
  if(inUl)out.push("</ul>");

  posts:[
    {oid:"a001",creator:"TechAfrica_News",otype:"Article",status:"published",category:"technology",language:"en",tags:["technology","ai","innovation"],seriesId:null,title:"How Generative AI is Reshaping African Software Development",content:`The continent's developer community is experiencing a quiet revolution. From Nairobi's Silicon Savannah to Lagos' island tech hubs, generative AI tools are rapidly changing how software gets built.\n\nIn a survey of over 2,000 African developers last quarter, nearly 60% reported using AI coding assistants daily — a figure that has tripled in 18 months.\n\n## What developers are actually saying\n\n"It's not replacing us," says Okonkwo Chidi, lead engineer at a Lagos fintech. "It's removing the boring parts so we can focus on the creative problem-solving that actually requires local context."\n\n## The ownership question\n\nAs AI tools lower the skill floor for certain development tasks, attention is shifting to whether African developers can own the tools they use — not just adopt the ones built elsewhere.`,nlikes:847,ncomments:4,views:3240,timestamp:T(5),flagged:false,likedBy:["bola_reads","ade_curious"],sharedBy:[],pollOptions:null,disputed:false,disputeNote:""},
    {oid:"a002",creator:"finance_amara",otype:"Article",status:"published",category:"finance",language:"en",tags:["finance","investment","diaspora"],seriesId:"s001",title:"Investing in Nigerian Startups: A Guide for the Diaspora",content:`As a young Nigerian who has navigated both the London and Lagos investment scenes, I am often asked: "How do I actually invest in startups back home?"\n\n## Know your investment thesis\n\nAre you betting on fintech, agritech, healthtech, or B2B SaaS? Each has different risk profiles and exit timelines.\n\n## Understand the instruments\n\nGet comfortable with SAFE notes and convertible instruments. They dominate pre-seed deals here, unlike the priced equity rounds common in Europe.\n\n## Network intentionally\n\nThe best deals in Lagos rarely appear on formal platforms. Join WhatsApp groups, attend Demo Africa, and find a trusted lead investor to co-invest with.`,nlikes:512,ncomments:3,views:2100,timestamp:T(12),flagged:false,likedBy:["tech_temi","bola_reads"],sharedBy:[],pollOptions:null,disputed:false,disputeNote:""},
    {oid:"a003",creator:"culture_kwame",otype:"Article",status:"published",category:"culture",language:"en",tags:["culture","literature","africa"],seriesId:null,title:"The New African Canon: Why Our Stories Must Be Told By Us",content:`For too long, the stories told about Africa were told by those who viewed the continent through the narrow aperture of distance.\n\nThat is changing. Slowly, unevenly, but unmistakably.\n\n## The renaissance underway\n\nGhanaian author Ama Owusu's debut novel sold over 200,000 copies in its first year, mostly through WhatsApp book clubs — not traditional publishing channels.\n\n## The infrastructure lesson\n\nThe infrastructure for African storytelling no longer needs to route through gatekeepers in London and New York. It can — and should — be built here.`,nlikes:389,ncomments:2,views:1560,timestamp:T(18),flagged:false,likedBy:["ade_curious"],sharedBy:[],pollOptions:null,disputed:false,disputeNote:""},
    {oid:"a004",creator:"TechAfrica_News",otype:"Article",status:"published",category:"technology",language:"en",tags:["technology","policy","ai"],seriesId:null,title:"Kenya's Draft AI Governance Framework Faces Criticism",content:`Kenya's Communications Authority released a draft framework for artificial intelligence governance last week, drawing immediate criticism from the technology community.\n\n"The framework was written without meaningful consultation," said Dr. Angela Ndungu of Strathmore University.\n\n## The contested provision\n\nA requirement that any AI system making 'consequential decisions' submit to a conformity assessment before deployment is the most disputed point.\n\n## The other side\n\nProponents argue some regulatory baseline is overdue. "We have seen real harms from unregulated AI systems in hiring and credit scoring."`,nlikes:634,ncomments:5,views:2890,timestamp:T(2),flagged:false,likedBy:["tech_temi","finance_amara","bola_reads"],sharedBy:["ade_curious"],pollOptions:null,disputed:false,disputeNote:""},
    {oid:"a005",creator:"EconoAfrica_Daily",otype:"Article",status:"published",category:"finance",language:"en",tags:["economics","markets","africa"],seriesId:null,title:"Pan-African Stock Exchange: Dream or Near Reality?",content:`The idea of a unified African stock exchange has circulated in development finance circles for decades. Recent moves by the African Union suggest the concept may finally be gathering momentum.\n\n"The collective market capitalisation of African exchanges exceeds $1.5 trillion," noted the AfDB's chief economist. "Fragmentation is costing us liquidity and depth."`,nlikes:291,ncomments:3,views:1200,timestamp:T(7),flagged:false,likedBy:["finance_amara"],sharedBy:[],pollOptions:null,disputed:false,disputeNote:""},
    {oid:"a006",creator:"tech_temi",otype:"Article",status:"published",category:"business",language:"en",tags:["startups","entrepreneurship","lagos"],seriesId:null,title:"What I Learned Failing My First Startup in Lagos",content:`Two years ago, I shut down Lokari — a hyperlocal delivery app we spent 18 months building. We raised ₦12m and still failed.\n\n## Lesson 1: The infrastructure problem\n\nWe built a beautiful product assuming our logistics partners would be reliable. They were not. The last-mile problem in Lagos is not a product problem — it is a roads, traffic, and trust problem.\n\n## Lesson 2: Unit economics from day one\n\nIf your unit economics don't work at 100 users, they rarely fix themselves at 10,000.\n\n## Lesson 3: Knowing when to quit\n\nI held on four months longer than I should have. I am building again. Differently this time.`,nlikes:723,ncomments:6,views:4100,timestamp:T(9),flagged:false,likedBy:["finance_amara","bola_reads","ade_curious","culture_kwame"],sharedBy:["bola_reads"],pollOptions:null,disputed:false,disputeNote:""},
    {oid:"a007",creator:"history_adaeze",otype:"Article",status:"published",category:"history",language:"en",tags:["history","africa","education"],seriesId:"s002",title:"The Great Libraries of West Africa: What We Have Forgotten",content:`Before European contact, West Africa was home to some of the world's great centres of learning. The library of Timbuktu held an estimated 700,000 manuscripts.\n\nScholars from across the Islamic world travelled to Sankore University to study mathematics, astronomy, medicine, and law.\n\n## Why this matters today\n\nThe lie that Africa had no intellectual tradition before colonialism has consequences. It shapes policy, funding, and what young Africans believe is possible.\n\n**Knowing our history is not nostalgia — it is infrastructure.**`,nlikes:445,ncomments:7,views:1890,timestamp:T(14),flagged:false,likedBy:["culture_kwame","bola_reads","ade_curious"],sharedBy:[],pollOptions:null,disputed:false,disputeNote:""},
    {oid:"a008",creator:"diaspora_kofi",otype:"Article",status:"published",category:"careers",language:"en",tags:["careers","diaspora"],seriesId:null,title:"Navigating the European Job Market as an African Professional",content:`When I arrived in London for my master's degree, I assumed the hardest part was over. What I had not accounted for was the invisible curriculum.\n\n## Your name is not a barrier\n\nThe companies worth working for will not penalise you for your name.\n\n## Your African experience is expertise\n\nThe economic complexity you have navigated, the resourcefulness you have developed, the multilingualism — these are genuinely valuable.\n\n## Find your people\n\nAfrican professionals networks in your city are not just social. They are intelligence networks.`,nlikes:612,ncomments:9,views:2780,timestamp:T(6),flagged:false,likedBy:["bola_reads","finance_amara"],sharedBy:["ade_curious"],pollOptions:null,disputed:false,disputeNote:""},

const LS_KEY="thePodium_v5_state";
function saveState(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify({
      users:STATE.users,posts:STATE.posts,series:STATE.series,groups:STATE.groups,
      spaces:STATE.spaces,partnerships:STATE.partnerships,notifs:STATE.notifs,flags:STATE.flags,
      dms:STATE.dms,currentUser:STATE.user?.username||null,guestCount:STATE.guestCount,
      viewedPosts:[...STATE.viewedPosts],lang:STATE.lang,theme:STATE.theme
    }));
  }catch(e){/* storage unavailable (sandboxed iframe / private mode) — app still works in-memory */}
}
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);if(!raw)return;
    const s=JSON.parse(raw);
    if(s.users)STATE.users=s.users;
    if(s.posts)STATE.posts=s.posts;
    if(s.series)STATE.series=s.series;
    if(s.groups)STATE.groups=s.groups;
    if(s.spaces)STATE.spaces=s.spaces;
    if(s.partnerships)STATE.partnerships=s.partnerships;
    if(s.notifs)STATE.notifs=s.notifs;
    if(s.flags)STATE.flags=s.flags;
    if(s.dms)STATE.dms=s.dms;
    if(s.lang)STATE.lang=s.lang;if(s.theme)STATE.theme=s.theme;
    if(typeof s.guestCount==="number")STATE.guestCount=s.guestCount;
    if(Array.isArray(s.viewedPosts))STATE.viewedPosts=new Set(s.viewedPosts);
    if(s.currentUser&&STATE.users[s.currentUser]){STATE.user=STATE.users[s.currentUser];STATE.view="feed";}
  }catch(e){/* corrupt state — start fresh */}
}
function resetDemo(){try{localStorage.removeItem(LS_KEY);}catch(e){}location.reload();}

let _suppressPush=false;
function navigate(view, sub=null){
  if(view==="settings"){
    STATE.view="settings";STATE.sub=null;
    _settingsIdentity=null;_settingsExpertise=null;_settingsInterests=null;
    window.scrollTo(0,0);renderNav();
    document.getElementById("app").innerHTML=`<div class="fade-in">${renderSettings()}</div>`;
    pushHistory();saveState();
    return;
  }
  STATE.view=view; STATE.sub=sub;
  window.scrollTo(0,0);
  renderNav();
  renderApp();
  pushHistory();
  saveState();
}
function pushHistory(){
  if(_suppressPush)return;
  try{history.pushState({view:STATE.view,sub:STATE.sub},"",`#${STATE.view}${STATE.sub?"/"+STATE.sub:""}`);}catch(e){}
}
window.addEventListener("popstate",e=>{
  const s=e.state||{view:STATE.user?"feed":"landing",sub:null};
  _suppressPush=true;
  STATE.view=s.view;STATE.sub=s.sub;
  renderNav();
  if(s.view==="settings"&&STATE.user){document.getElementById("app").innerHTML=`<div class="fade-in">${renderSettings()}</div>`;}
  else renderApp();
  _suppressPush=false;
});
function toggleMobileMenu(){
  const m=document.getElementById("mobile-menu");

  const pages=navPages();
  m.innerHTML=pages.map(p=>`<button class="nav-link${STATE.view===p.k?" active":""}" onclick="document.getElementById('mobile-menu').style.display='none';navigate('${p.k}')">${p.l}</button>`).join("");
  m.style.display="block";
}

let toastTimer;
let _toastAction=null;
function showToast(msg,type="info",action=null){
  const tEl=document.getElementById("toast");
  _toastAction=action;
  tEl.innerHTML=`<span>${msg}</span>${action?`<button class="toast-undo" onclick="_toastAction&&_toastAction.fn();document.getElementById('toast').style.display='none';_toastAction=null;">${action.label}</button>`:""}`;
  tEl.className=`toast-${type}`;
  tEl.style.display="flex";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{tEl.style.display="none";_toastAction=null;},action?5200:3000);
}

function avatarHtml(username,size=36){
  const initials=username.slice(0,2).toUpperCase();
  const hue=username.split("").reduce((a,c)=>a+c.charCodeAt(0),0)%360;
  const dark=STATE.theme==="dark";
  const bg=dark?`hsl(${hue},30%,20%)`:`hsl(${hue},48%,88%)`;
  const bd=dark?`hsl(${hue},28%,30%)`:`hsl(${hue},38%,62%)`;
  const fg=dark?`hsl(${hue},50%,68%)`:`hsl(${hue},55%,26%)`;
  return `<div class="avatar" style="width:${size}px;height:${size}px;min-width:${size}px;background:${bg};border:2px solid ${bd};font-size:${Math.round(size*.34)}px;color:${fg}">${initials}</div>`;
}

function getPubPosts(){return STATE.posts.filter(p=>p.status==="published"&&!p.flagged&&p.otype!=="Comment");}
function getFeedPosts(){
  const followed=new Set(STATE.user?.following||[]);
  const interests=new Set(STATE.user?.interests||[]);
  return getPubPosts()
    .filter(p=>{
      if(STATE.feedMode==="both")return true;
      const pc=STATE.users[p.creator];
      if(STATE.feedMode==="continent")return pc?.africanIdentity==="continent";
      if(STATE.feedMode==="diaspora")return pc?.africanIdentity==="diaspora";
      return true;
    })
    .map(p=>({...p,_score:(followed.has(p.creator)?150:0)+p.tags.filter(t=>interests.has(t)).length*30+Math.log1p(p.nlikes)*5,_reason:followed.has(p.creator)?`Following @${p.creator}`:p.tags.some(t=>interests.has(t))?"In your interests":p.nlikes>300?"Trending":null}))
    .sort((a,b)=>b._score-a._score||new Date(b.timestamp)-new Date(a.timestamp));
}

function toggleLike(oid){
  if(!STATE.user)return showToast("Sign in to like content");
  if(!can(STATE.user,"like"))return showToast("Your account type cannot like content");
  const post=STATE.posts.find(p=>p.oid===oid);if(!post)return;
  const liked=(post.likedBy||[]).includes(STATE.user.username);
  post.likedBy=liked?post.likedBy.filter(v=>v!==STATE.user.username):[...(post.likedBy||[]),STATE.user.username];
  post.nlikes=liked?post.nlikes-1:post.nlikes+1;
  if(!liked)pushNotif(post.creator,"like",STATE.user.username,`@${STATE.user.username} liked your post`,oid);
  saveState();
  renderApp(); renderNav();
}

  const s=STATE.series.find(x=>x.id===sid);if(!s)return;
  const isS=s.subscribedBy.includes(STATE.user.username);
  s.subscribedBy=isS?s.subscribedBy.filter(v=>v!==STATE.user.username):[...s.subscribedBy,STATE.user.username];
  if(!isS)pushNotif(s.creator,"series_sub",STATE.user.username,`@${STATE.user.username} subscribed to your series`,sid);
  showToast(isS?"Unsubscribed.":"Subscribed! You'll be notified of new episodes.","success");
  renderApp();
}

function endorseExpertise(targetUser,tag){
  if(!STATE.user)return showToast("Sign in to endorse");
  if(STATE.user.username===targetUser)return showToast("Cannot self-endorse");
  const u=STATE.users[targetUser];if(!u)return;
  if(!u.expertiseEndorsements)u.expertiseEndorsements={};
  const existing=u.expertiseEndorsements[tag]||[];
  if(existing.includes(STATE.user.username)){showToast("Already endorsed");return;}
  u.expertiseEndorsements[tag]=[...existing,STATE.user.username];
  pushNotif(targetUser,"endorsement",STATE.user.username,`@${STATE.user.username} endorsed your expertise in ${tag}`);
  showToast(`Endorsed @${targetUser}'s expertise in ${tag} ✓`,"success");
  renderApp();
}

function voteOnPoll(oid,idx){
  if(!STATE.user)return showToast("Sign in to vote");
  const post=STATE.posts.find(p=>p.oid===oid);if(!post||!post.pollOptions)return;
  const hasVoted=post.pollOptions.some(o=>o.votes.includes(STATE.user.username));
  if(hasVoted){showToast("Already voted");return;}
  post.pollOptions[idx].votes.push(STATE.user.username);
  showToast("Vote recorded!","success");
  renderApp();
}

function shareWhatsApp(oid){
  const post=STATE.posts.find(p=>p.oid===oid);if(!post)return;
  const msg=encodeURIComponent(`${post.title}\n\n${post.content.replace(/[#>*`\[\]()]/g,"").slice(0,120)}…\n\nRead on The Podium`);
  window.open(`https://wa.me/?text=${msg}`,"_blank");
}

function toggleNotifs(){
  const panel=document.getElementById("notif-panel");
  if(!panel)return;
  const isOpen=panel.style.display!=="none";
  if(isOpen){panel.style.display="none";return;}
  const user=STATE.user;if(!user)return;
  STATE.notifs.filter(n=>n.for===user.username).forEach(n=>n.read=true);
  const myNotifs=STATE.notifs.filter(n=>n.for===user.username).slice(0,12);
  panel.innerHTML=`<div style="padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text);">Notifications</div>`+
    (myNotifs.length===0?`<div style="padding:20px;font-size:13px;color:var(--text-dim);text-align:center;">No notifications yet</div>`:
    myNotifs.map(n=>`<div class="notif-item${n.read?"":" unread"}" onclick="document.getElementById('notif-panel').style.display='none';${n.type&&n.type.startsWith("dm")?`navigate('messages')`:n.entityId?`navigate('article','${n.entityId}')`:""}">
      <div class="notif-text">${escHtml(n.text)}</div>
      <div class="notif-time">${ago(n.ts)}</div>
    </div>`).join(""));
  panel.style.display="block";
  setTimeout(()=>{
    function closePanel(e){if(!panel.contains(e.target)&&e.target.id!=="notif-panel"){panel.style.display="none";document.removeEventListener("click",closePanel);}}
    document.addEventListener("click",closePanel);
  },10);
  renderNav();
}

// ─── Main render ──────────────────────────────────────────────────────────────
function renderApp(){
  const app=document.getElementById("app");
  const {view,sub,user}=STATE;
  let html="";
  if(view==="landing")html=renderLanding();
  else if(view==="feed"&&user)html=renderFeed();
  else if(view==="articles")html=renderArticles();
  else if(view==="article")html=renderPostDetail(sub,"articles");
  else if(view==="forum")html=renderForum();
  else if(view==="thread")html=renderPostDetail(sub,"forum");
  else if(view==="groups")html=renderGroups();
  else if(view==="group")html=renderGroupDetail(sub);
  else if(view==="profile")html=renderProfile(sub);
  else if(view==="search")html=renderSearch();
  else if(view==="messages"&&user)html=renderMessages();
  else if(view==="digest")html=renderDigest();
  else if(view==="spaces")html=renderSpaces();
  else if(view==="partnerships")html=renderPartnerships();
  else if(view==="resources")html=renderResources();
  else if(view==="about")html=renderAbout();
  else if(view==="modqueue"&&user?.isMod)html=renderModQueue();
  else html=renderLanding();
  app.innerHTML=`<div class="fade-in">${html}</div>`;
  if(STATE.onboardStep>0)showOnboarding();
  updateProgressBar();
  const dmBox=document.getElementById("dm-msgs-box");
  if(dmBox)dmBox.scrollTop=dmBox.scrollHeight;
  saveState();
}
// Reading progress bar (articles only)
function updateProgressBar(){
  const bar=document.getElementById("read-progress");
  if(!bar)return;
  if(STATE.view!=="article"){bar.style.width="0";return;}
  const h=document.documentElement;
  const total=h.scrollHeight-h.clientHeight;
  bar.style.width=total>0?`${Math.min(100,(h.scrollTop/total)*100)}%`:"0";
}
window.addEventListener("scroll",updateProgressBar,{passive:true});

function showAuthErr(msg){const e=document.getElementById("auth-err");if(e){e.textContent=msg;e.style.display="block";}}
function doSignIn(){
  const u=document.getElementById("si-user")?.value.trim();
  const pw=document.getElementById("si-pw")?.value;
  const found=STATE.users[u];
  if(!found)return showAuthErr("Username not found");
  if(found.pw!==hashPw(pw))return showAuthErr("Incorrect password");
  STATE.user=found;navigate("feed");
}
function doSignUp(){
  const u=document.getElementById("su-user")?.value.trim();
  const pw=document.getElementById("su-pw")?.value;
  const type=document.getElementById("su-type")?.value;
  const ref=document.getElementById("su-ref")?.value.trim().toUpperCase();
  const bio=document.getElementById("su-bio")?.value.trim();
  if(!u)return showAuthErr("Username required");
  if(!/^[a-zA-Z0-9_]{3,24}$/.test(u))return showAuthErr("3–24 chars, letters/numbers/underscores");
  if(STATE.users[u])return showAuthErr("Username already taken");
  const err=validatePw(pw);if(err)return showAuthErr(err);
  const referrer=Object.values(STATE.users).find(x=>x.referralCode===ref);
  const refCode=`${u.toUpperCase().slice(0,6)}${Math.floor(Math.random()*9000)+1000}`;
  const nu={username:u,pw:hashPw(pw),type,isMod:false,verified:false,bio:bio||"",africanIdentity:"continent",location:"continent",countryOrigin:"",countryResidence:"",profession:"",industry:"",yearsExp:"",linkedinUrl:"",expertise:[],expertiseEndorsements:{},joined:new Date().toISOString(),interests:[],followers:[],following:[],referralCode:refCode,referredBy:referrer?.username||null,foundingCreator:false,violations:0,bookmarks:[],readHistory:[]};
  STATE.users[u]=nu;STATE.user=nu;
  if(referrer)pushNotif(referrer.username,"referral","",`Your referral code brought @${u} to The Podium!`);
  STATE.onboardStep=1;navigate("feed");
}

// ─── Onboarding ───────────────────────────────────────────────────────────────

      <div style="font-size:36px;margin-bottom:16px;">🌍</div>

      <div style="display:grid;gap:10px;margin-bottom:20px;">
        ${[["continent","🌍","I'm on the African continent","Living and working in Africa"],["diaspora","✈️","I'm part of the African diaspora","African living or working abroad"],["ally","🤝","I'm an ally and supporter","Non-African interested in Africa"]].map(([id,ic,l,s])=>`<button class="ob-option" onclick="obSelect('${id}')"><span style="font-size:24px;">${ic}</span><div style="text-align:left;"><div style="font-size:14px;font-weight:600;color:var(--text);">${l}</div><div style="font-size:12px;color:var(--text-muted);">${s}</div></div></button>`).join("")}

    div.innerHTML=`<div class="modal" style="max-width:460px;">
      <div style="font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:20px;letter-spacing:.08em;">STEP 2 OF 3 — YOUR ROOTS</div>

      ${u.africanIdentity==="diaspora"?`<div class="form-group"><label class="form-label">Country of Residence</label><select id="ob-residence"><option value="">Select country…</option>${DIASPORA_COUNTRIES.map(c=>`<option value="${c}"${u.countryResidence===c?" selected":""}>${c}</option>`).join("")}</select></div>`:"<div id='ob-residence-wrap'></div>"}
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn btn-primary" onclick="obSaveCountry()">Continue</button>
        <button class="btn btn-ghost" onclick="STATE.onboardStep=3;showOnboarding()">Skip</button>
      </div>
    </div>`;
  } else if(STATE.onboardStep===3){
    const u=STATE.users[STATE.user.username];
    div.innerHTML=`<div class="modal" style="max-width:500px;">
      <div style="font-size:11px;font-weight:600;color:var(--text-dim);margin-bottom:20px;letter-spacing:.08em;">STEP 3 OF 3 — YOUR INTERESTS</div>
      <h2 style="font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;">What do you want to read?</h2>

      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;">${INTERESTS.map(i=>`<button id="ob-int-${i}" onclick="obToggleInterest('${i}')" style="padding:4px 10px;border-radius:20px;border:1px solid ${(u.interests||[]).includes(i)?"var(--amber)":"var(--border)"};background:${(u.interests||[]).includes(i)?"var(--amber-faint)":"transparent"};color:${(u.interests||[]).includes(i)?"var(--amber)":"var(--text-muted)"};font-size:11px;font-weight:500;cursor:pointer;font-family:'Outfit',sans-serif;">${i}</button>`).join("")}</div>

function obSelect(id){const u=STATE.users[STATE.user.username];u.africanIdentity=id;u.location=id==="diaspora"?"diaspora":"continent";STATE.user.africanIdentity=id;STATE.onboardStep=2;showOnboarding();}
function obSaveCountry(){const u=STATE.users[STATE.user.username];u.countryOrigin=document.getElementById("ob-origin")?.value||"";const r=document.getElementById("ob-residence");if(r)u.countryResidence=r.value||"";STATE.user.countryOrigin=u.countryOrigin;STATE.user.countryResidence=u.countryResidence;STATE.onboardStep=3;showOnboarding();}
function obToggleInterest(i){const u=STATE.users[STATE.user.username];const has=(u.interests||[]).includes(i);u.interests=has?u.interests.filter(x=>x!==i):[...(u.interests||[]),i];STATE.user.interests=u.interests;const btn=document.getElementById(`ob-int-${i}`);if(btn){btn.style.borderColor=has?"var(--border)":"var(--amber)";btn.style.background=has?"transparent":"var(--amber-faint)";btn.style.color=has?"var(--text-muted)":"var(--amber)";}}
function obFinish(){const ob=document.getElementById("ob-overlay");if(ob)ob.remove();STATE.onboardStep=0;showToast("Welcome to The Podium! Your feed is ready.","success");renderApp();}

function toggleReplyBox(cid){
  const box=document.getElementById(`reply-box-${cid}`);
  if(box)box.style.display=box.style.display==="none"?"block":"none";
  const ta=document.getElementById(`reply-ta-${cid}`);if(ta&&box.style.display==="block")ta.focus();
}
function submitReply(commentOid,postOid){
  const ta=document.getElementById(`reply-ta-${commentOid}`);
  if(!ta)return;const text=ta.value.trim();if(!text)return showToast("Write something first");
  const nc={oid:uid(),creator:STATE.user.username,otype:"Comment",status:"published",parentID:commentOid,category:"",language:"en",tags:[],title:"",content:text,pollOptions:null,nlikes:0,ncomments:0,views:0,timestamp:new Date().toISOString(),flagged:false,likedBy:[],sharedBy:[],disputed:false,disputeNote:""};
  STATE.posts.push(nc);
  const parentComment=STATE.posts.find(p=>p.oid===commentOid);
  const rootPost=STATE.posts.find(p=>p.oid===postOid);
  if(rootPost)rootPost.ncomments=(rootPost.ncomments||0)+1;
  if(parentComment)pushNotif(parentComment.creator,"reply",STATE.user.username,`@${STATE.user.username} replied to your comment`,postOid);
  saveState();renderApp();
}

function submitComment(parentID){
  const ta=document.getElementById(`comment-ta-${parentID}`);
  if(!ta)return;const text=ta.value.trim();if(!text)return showToast("Write something first");
  const nc={oid:uid(),creator:STATE.user.username,otype:"Comment",status:"published",parentID,category:"",language:"en",tags:[],title:"",content:text,pollOptions:null,nlikes:0,ncomments:0,views:0,timestamp:new Date().toISOString(),flagged:false,likedBy:[],sharedBy:[],disputed:false,disputeNote:""};
  STATE.posts.push(nc);
  const parent=STATE.posts.find(p=>p.oid===parentID);
  if(parent){parent.ncomments=(parent.ncomments||0)+1;pushNotif(parent.creator,"comment",STATE.user.username,`@${STATE.user.username} commented on your post`,parentID);}
  renderApp();
}

function joinGroup(gid){if(!STATE.user)return showToast("Sign in to join");const g=STATE.groups.find(x=>x.id===gid);if(g&&!g.members.includes(STATE.user.username))g.members.push(STATE.user.username);showToast("Joined the group!","success");saveState();renderApp();}

function submitGroupPost(gid){
  const g=STATE.groups.find(x=>x.id===gid);if(!g)return;
  if(!STATE.user||!g.members.includes(STATE.user.username))return showToast("Join the group to post");
  const inp=document.getElementById("gpost-input");const text=inp?.value.trim();
  if(!text)return showToast("Write something first");
  if(!g.posts)g.posts=[];
  g.posts.push({id:uid(),creator:STATE.user.username,text,ts:new Date().toISOString(),likedBy:[]});
  saveState();renderApp();showToast("Posted to the group board!","success");
}
function likeGroupPost(gid,pid,btn){
  if(!STATE.user)return showToast("Sign in to like");
  const g=STATE.groups.find(x=>x.id===gid);const bp=g?.posts?.find(p=>p.id===pid);if(!bp)return;
  if(!bp.likedBy)bp.likedBy=[];
  const liked=bp.likedBy.includes(STATE.user.username);
  bp.likedBy=liked?bp.likedBy.filter(x=>x!==STATE.user.username):[...bp.likedBy,STATE.user.username];
  if(btn){btn.innerHTML=`♥ ${bp.likedBy.length}`;btn.style.color=liked?"var(--text-dim)":"var(--amber)";}
  saveState();
}
function removeGroupPost(gid,pid){
  const g=STATE.groups.find(x=>x.id===gid);if(!g)return;
  g.posts=(g.posts||[]).filter(p=>p.id!==pid);
  saveState();renderApp();showToast("Post removed by moderator.");
}

function settingsSelectIdentity(v){
  const pu=STATE.users[STATE.user.username];
  _settingsIdentity=v;
  ["continent","diaspora","ally"].forEach(id=>{const btn=document.getElementById(`s-id-${id}`);if(btn){btn.style.borderColor=id===v?"var(--amber)":"var(--border)";btn.style.background=id===v?"var(--amber-faint)":"transparent";btn.style.color=id===v?"var(--amber)":"var(--text-muted)";}});
}
function settingsToggleEx(ex){
  const pu=STATE.users[STATE.user.username];
  if(!_settingsExpertise)_settingsExpertise=[...(pu.expertise||[])];
  const has=_settingsExpertise.includes(ex);
  if(!has&&_settingsExpertise.length>=5)return showToast("Maximum 5 expertise areas");
  _settingsExpertise=has?_settingsExpertise.filter(x=>x!==ex):[..._settingsExpertise,ex];
  const key=ex.replace(/\s/g,"-");const btn=document.getElementById(`s-ex-${key}`);
  if(btn){btn.style.borderColor=has?"var(--border)":"var(--amber)";btn.style.background=has?"transparent":"var(--amber-faint)";btn.style.color=has?"var(--text-muted)":"var(--amber)";}
}
function settingsToggleInt(i){
  const pu=STATE.users[STATE.user.username];
  if(!_settingsInterests)_settingsInterests=[...(pu.interests||[])];
  const has=_settingsInterests.includes(i);
  _settingsInterests=has?_settingsInterests.filter(x=>x!==i):[..._settingsInterests,i];
  const btn=document.getElementById(`s-int-${i}`);
  if(btn){btn.style.borderColor=has?"var(--border)":"var(--amber)";btn.style.background=has?"transparent":"var(--amber-faint)";btn.style.color=has?"var(--text-muted)":"var(--amber)";}
}
function saveSettings(){
  const pu=STATE.users[STATE.user.username];
  pu.bio=document.getElementById("s-bio")?.value||pu.bio;
  pu.profession=document.getElementById("s-prof")?.value||"";
  pu.industry=document.getElementById("s-ind")?.value||"";
  pu.linkedinUrl=document.getElementById("s-li")?.value||"";
  pu.countryOrigin=document.getElementById("s-origin")?.value||pu.countryOrigin;
  if(_settingsIdentity)pu.africanIdentity=_settingsIdentity;
  if(_settingsExpertise)pu.expertise=_settingsExpertise;
  if(_settingsInterests)pu.interests=_settingsInterests;
  STATE.user={...STATE.user,...pu};
  _settingsIdentity=null;_settingsExpertise=null;_settingsInterests=null;
  navigate("profile",STATE.user.username);showToast("Profile updated","success");
}

// ─── Search ───────────────────────────────────────────────────────────────────
function renderSearch(){
  return`<div class="wrap">
    <div class="section-title"><div><h1>${t("search")}</h1></div></div>

      ${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<button onclick='STATE._countryFilter={type:"origin",value:"${c}",label:"🌍 ${c}"};renderApp()' style="padding:5px 13px;border-radius:20px;border:1px solid ${sel?.type==="origin"&&sel?.value===c?"var(--amber)":"var(--border)"};background:${sel?.type==="origin"&&sel?.value===c?"var(--amber-faint)":"transparent"};color:${sel?.type==="origin"&&sel?.value===c?"var(--amber)":"var(--text-muted)"};font-size:12px;font-weight:500;cursor:pointer;">🌍 ${c} <span style="opacity:.6">${n}</span></button>`).join("")}
      ${Object.entries(diasporaCounts).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<button onclick='STATE._countryFilter={type:"residence",value:"${c}",label:"✈️ ${c}"};renderApp()' style="padding:5px 13px;border-radius:20px;border:1px solid ${sel?.type==="residence"&&sel?.value===c?"var(--blue)":"var(--border)"};background:${sel?.type==="residence"&&sel?.value===c?"var(--blue-tint)":"transparent"};color:${sel?.type==="residence"&&sel?.value===c?"var(--blue)":"var(--text-muted)"};font-size:12px;font-weight:500;cursor:pointer;">✈️ Diaspora in ${c} <span style="opacity:.6">${n}</span></button>`).join("")}
    </div>

}
function creatorRowHtml(u){
  return `<div onclick="navigate('profile','${u.username}')" style="display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:8px;cursor:pointer;" onmouseover="this.style.borderColor='var(--border-light)';this.style.background='var(--elevated)'" onmouseout="this.style.borderColor='var(--border)';this.style.background='var(--surface)'">
    ${avatarHtml(u.username,38)}
    <div style="flex:1;min-width:0;"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;"><span style="font-size:13px;font-weight:600;color:var(--text);">@${u.username}</span>${typeBadge(u.type)}${u.verified?`<span class="badge badge-verified">✓ VERIFIED</span>`:""}${locationBadge(u)}</div>
    <p style="font-size:12px;color:var(--text-muted);margin-top:2px;">${escHtml(u.bio||"")}</p>
    ${u.expertise?.length>0?`<div style="display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;">${u.expertise.slice(0,3).map(ex=>`<span style="font-size:10px;color:var(--text-dim);background:var(--elevated);border-radius:3px;padding:1px 5px;">${escHtml(ex)}</span>`).join("")}</div>`:""}</div>
    <div style="font-size:12px;color:var(--text-dim);white-space:nowrap;">${u.followers.length} followers</div>
  </div>`;
}
function renderSearchResults(init=false){
  const q=(init?STATE._searchQ||"":document.getElementById("search-q")?.value)||"";
  STATE._searchQ=q;
  const el=document.getElementById("search-results");
  const cf=STATE._countryFilter;
  let creators=Object.values(STATE.users);
  if(cf){
    creators=creators.filter(u=>cf.type==="origin"?u.countryOrigin===cf.value:(u.africanIdentity==="diaspora"&&u.countryResidence===cf.value));
  }
  let html;
  if(q.trim()){
    const qL=q.toLowerCase();
    const matchedUsers=creators.filter(u=>u.username.toLowerCase().includes(qL)||u.bio?.toLowerCase().includes(qL)||u.expertise?.some(ex=>ex.toLowerCase().includes(qL)));
    const matchedPosts=STATE.posts.filter(p=>p.status==="published"&&!p.flagged&&p.otype!=="Comment"&&(p.title.toLowerCase().includes(qL)||p.tags.some(x=>x.includes(qL))));
    html=`${matchedUsers.map(creatorRowHtml).join("")}${matchedPosts.map(p=>cardHtml(p)).join("")}
      ${matchedUsers.length===0&&matchedPosts.length===0?`<div style="text-align:center;padding:36px;color:var(--text-dim);"><p style="margin-bottom:8px;">No results for "${escHtml(q)}"${cf?` in ${cf.label}`:""}.</p><p style="font-size:12px;">Try a broader term, or browse creators below.</p></div>`:""}`;
  } else {
    html=`<div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;">${cf?`${cf.label} — ${creators.length} creator${creators.length!==1?"s":""}`:t("allCreators")}</div>${creators.map(creatorRowHtml).join("")}`;
  }
  if(el)el.innerHTML=html;
  return html;
}

// ─── Messages (DMs with intro-request gate) ───────────────────────────────────
function findDm(a,b){return STATE.dms.find(d=>d.participants.includes(a)&&d.participants.includes(b));}
function openDmWith(target){
  if(!STATE.user)return navigate("landing");
  if(target===STATE.user.username)return;
  const existing=findDm(STATE.user.username,target);
  if(existing){STATE.activeDm=existing.id;navigate("messages");return;}
  openIntroModal(target);
}
function openIntroModal(target){
  createModal(`
    <h2 style="font-family:'Fraunces',serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;">${t("requestIntro")} — @${target}</h2>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.6;">To keep inboxes respectful, first messages are intro requests. @${target} will see your note and choose whether to open the conversation.</p>
    <div class="form-group"><label class="form-label">Your intro note</label><textarea id="intro-note" placeholder="Who you are and why you'd like to connect…" style="height:90px;"></textarea></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="sendIntro('${target}')">Send Request</button>
      <button class="btn btn-secondary" onclick="closeModal()">${t("cancel")}</button>
    </div>
  `);
}
function sendIntro(target){
  const note=document.getElementById("intro-note")?.value.trim();
  if(!note)return showToast("Write a short intro note first");
  const dm={id:uid(),participants:[STATE.user.username,target],status:"pending",requestedBy:STATE.user.username,createdAt:new Date().toISOString(),messages:[{from:STATE.user.username,text:note,ts:new Date().toISOString()}]};
  STATE.dms.unshift(dm);
  pushNotif(target,"dm_request",STATE.user.username,`@${STATE.user.username} sent you an intro request`);
  closeModal();saveState();renderNav();
  showToast("Intro request sent. You'll be able to chat once they accept.","success");
}
function acceptIntro(dmId){
  const d=STATE.dms.find(x=>x.id===dmId);if(!d)return;
  d.status="accepted";
  pushNotif(d.requestedBy,"dm_accept",STATE.user.username,`@${STATE.user.username} accepted your intro request — you can now message each other`);
  STATE.activeDm=dmId;saveState();renderNav();renderApp();
  showToast("Intro accepted — conversation open.","success");
}
function declineIntro(dmId){
  STATE.dms=STATE.dms.filter(x=>x.id!==dmId);
  if(STATE.activeDm===dmId)STATE.activeDm=null;
  saveState();renderNav();renderApp();showToast("Request declined.");
}
function sendDmMessage(dmId){
  const inp=document.getElementById("dm-input");if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  const d=STATE.dms.find(x=>x.id===dmId);if(!d||d.status!=="accepted")return;
  d.messages.push({from:STATE.user.username,text,ts:new Date().toISOString()});
  const other=d.participants.find(p=>p!==STATE.user.username);
  pushNotif(other,"dm",STATE.user.username,`New message from @${STATE.user.username}`);
  saveState();renderApp();
}
function renderMessages(){
  const me=STATE.user.username;
  const mine=STATE.dms.filter(d=>d.participants.includes(me));
  const incoming=mine.filter(d=>d.status==="pending"&&d.requestedBy!==me);
  const outgoing=mine.filter(d=>d.status==="pending"&&d.requestedBy===me);
  const accepted=mine.filter(d=>d.status==="accepted").sort((a,b)=>{
    const la=a.messages[a.messages.length-1]?.ts||a.createdAt;
    const lb=b.messages[b.messages.length-1]?.ts||b.createdAt;
    return new Date(lb)-new Date(la);
  });
  if(!STATE.activeDm&&accepted.length)STATE.activeDm=accepted[0].id;
  const active=mine.find(d=>d.id===STATE.activeDm&&d.status==="accepted");
  return `<div class="wrap-wide">
    <div class="section-title"><div><h1>${t("messages")}</h1><p>Private conversations, opened by mutual consent</p></div></div>
    ${incoming.length>0?`<div style="margin-bottom:20px;">
      <div style="font-size:12px;font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;">${t("introRequests")} (${incoming.length})</div>
      ${incoming.map(d=>{const from=d.requestedBy;return`<div class="card no-hover" style="margin-bottom:10px;border-color:var(--accent-border);">
        <div style="display:flex;gap:12px;align-items:flex-start;">
          ${avatarHtml(from,38)}
          <div style="flex:1;min-width:0;">
            <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;"><span style="font-size:13px;font-weight:600;color:var(--text);cursor:pointer;" onclick="navigate('profile','${from}')">@${from}</span>${STATE.users[from]?typeBadge(STATE.users[from].type):""}<span style="font-size:11px;color:var(--text-dim);">· ${ago(d.createdAt)}</span></div>
            <p style="font-size:13px;color:var(--text-muted);line-height:1.6;font-style:italic;">"${escHtml(d.messages[0]?.text||"")}"</p>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0;">
            <button class="btn btn-sm btn-success" onclick="acceptIntro('${d.id}')">${t("accept")}</button>
            <button class="btn btn-sm btn-secondary" onclick="declineIntro('${d.id}')">${t("decline")}</button>
          </div>
        </div>
      </div>`;}).join("")}
    </div>`:""}
    <div class="dm-layout">
      <div class="dm-list">
        <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;">${t("conversations")}</div>
        ${accepted.length===0?`<p style="font-size:13px;color:var(--text-dim);line-height:1.6;">${t("noConversations")}</p>`:""}
        ${accepted.map(d=>{const other=d.participants.find(p=>p!==me);const last=d.messages[d.messages.length-1];return`<div class="dm-item${STATE.activeDm===d.id?" active":""}" onclick="STATE.activeDm='${d.id}';renderApp()">
          ${avatarHtml(other,34)}
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;font-weight:600;color:var(--text);">@${other}</div>
            <div style="font-size:11px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${last?escHtml(last.text.slice(0,38)):""}…</div>
          </div>
        </div>`;}).join("")}
        ${outgoing.length>0?`<div style="margin-top:16px;font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Sent — awaiting reply</div>
        ${outgoing.map(d=>{const other=d.participants.find(p=>p!==me);return`<div class="dm-item" style="opacity:.6;cursor:default;">${avatarHtml(other,30)}<div><div style="font-size:12px;font-weight:600;color:var(--text-muted);">@${other}</div><div style="font-size:10px;color:var(--text-dim);">${t("introPending")}</div></div></div>`;}).join("")}`:""}
      </div>
      ${active?(()=>{const other=active.participants.find(p=>p!==me);return`<div class="dm-thread">

// ─── Mod Queue ────────────────────────────────────────────────────────────────
function renderModQueue(){
  if(!STATE.user?.isMod)return`<div class="wrap"><p style="color:var(--text-muted)">Access restricted.</p></div>`;
  const pending=STATE.flags.filter(f=>f.status==="pending");
  const resolved=STATE.flags.filter(f=>f.status!=="pending");
  const tab=STATE.modTab||"pending";
  return`<div class="wrap">
    <div class="section-title"><div><h1>Moderation Queue</h1><p>${pending.length} pending · ${resolved.length} resolved</p></div></div>
    <div class="score-grid" style="margin-bottom:20px;">
      <div class="score-card"><div class="score-val">${STATE.flags.length}</div><div class="score-lbl">Total flags</div></div>
      <div class="score-card"><div class="score-val" style="color:var(--red);">${resolved.filter(f=>f.status==="confirmed").length}</div><div class="score-lbl">Removed</div></div>
      <div class="score-card"><div class="score-val" style="color:var(--green);">${resolved.filter(f=>f.status==="dismissed").length}</div><div class="score-lbl">Dismissed</div></div>
    </div>
    <div style="background:var(--red-tint);border:1px solid var(--red-border);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:18px;line-height:1.6;">⚠ SLA: Hate speech within 6 hours. All other flags within 24 hours.</div>
    <div style="display:flex;gap:6px;margin-bottom:16px;">${["pending","resolved","transparency"].map(t=>`<button onclick="STATE.modTab='${t}';renderApp()" style="padding:5px 12px;border-radius:6px;border:1px solid ${tab===t?"var(--amber)":"var(--border)"};background:${tab===t?"var(--amber-faint)":"transparent"};color:${tab===t?"var(--amber)":"var(--text-muted)"};font-size:12px;font-weight:600;cursor:pointer;">${t==="pending"?"Pending"+(pending.length>0?` (${pending.length})`:""):t==="resolved"?"Resolved":"Public Log"}</button>`).join("")}</div>
    ${tab==="pending"?`${pending.length===0?`<p style="color:var(--green);">✓ No pending flags.</p>`:""}
    ${pending.map(f=>{const post=STATE.posts.find(p=>p.oid===f.entityId);return`<div class="card no-hover" style="border-color:${f.reason==="Hate speech"?"var(--red-border)":"var(--border)"};margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;"><span class="badge badge-danger" style="color:var(--red);background:var(--red-tint);border-color:var(--red-border);text-transform:uppercase;">${f.reason}</span><div style="font-size:11px;color:var(--text-dim);">${ago(f.ts)}${f.reason==="Hate speech"?` <span style="color:var(--red);font-weight:600;">⚠ URGENT</span>`:""}</div></div>
      ${post?`<div style="background:var(--elevated);border-radius:6px;padding:10px 14px;margin-bottom:10px;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">@${post.creator} · ${post.otype}</div><p style="font-size:13px;color:var(--text-muted);line-height:1.6;">${escHtml(post.content.replace(/[#>*]/g,"").slice(0,200))}…</p></div>`:""}
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">Reported by @${f.reporter}${f.notes?` · "${f.notes}"`:""}:</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-sm btn-danger" onclick="resolveFlag('${f.id}','confirm')">Remove Content</button>
        <button class="btn btn-sm btn-secondary" onclick="resolveFlag('${f.id}','dismiss')">Dismiss</button>
        ${post&&f.reason==="Misinformation"?`<button class="btn btn-sm btn-amber" onclick="markDisputed('${f.entityId}')">Mark Disputed</button>`:""}
        ${post?`<button class="btn btn-sm btn-ghost" onclick="navigate('${post.otype==="Article"?"article":"thread"}','${post.oid}')">View</button>`:""}
      </div>
    </div>`;}).join("")}`:""}
    ${tab==="resolved"?resolved.map(f=>`<div class="card no-hover" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div><span style="font-size:12px;color:var(--text-muted);margin-right:8px;">${f.reason}</span><span style="font-size:11px;color:var(--text-dim);">@${f.reporter} · ${ago(f.ts)}</span></div><span style="font-size:11px;font-weight:600;color:${f.status==="confirmed"?"var(--red)":"var(--green)"};text-transform:uppercase;">${f.status==="confirmed"?"Removed":"Dismissed"}</span></div>`).join(""):""}
    ${tab==="transparency"?`<div class="card no-hover">
      <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;">Public Moderation Log</div>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:18px;line-height:1.65;">The Podium publishes moderation statistics to maintain community trust.</p>
      <div class="grid-2">${[["Total flags received",STATE.flags.length],["Reviewed",resolved.length],["Content removed",resolved.filter(f=>f.status==="confirmed").length],["Flags dismissed",resolved.filter(f=>f.status==="dismissed").length],["Avg review time","< 12 hours"],["Pending",pending.length]].map(([l,v])=>`<div style="background:var(--elevated);border-radius:6px;padding:10px 14px;"><div style="font-size:12px;color:var(--text-dim);margin-bottom:3px;">${l}</div><div style="font-size:18px;font-weight:600;color:var(--text);">${v}</div></div>`).join("")}</div>
    </div>`:""}
  </div>`;
}
function resolveFlag(id,action){
  const f=STATE.flags.find(x=>x.id===id);if(!f)return;
  f.status=action==="confirm"?"confirmed":"dismissed";
  if(action==="confirm"){const post=STATE.posts.find(p=>p.oid===f.entityId);if(post)post.flagged=true;
    const creator=f.entityCreator;const u=STATE.users[creator];
    if(u){u.violations=(u.violations||0)+1;if(u.violations===2)showToast(`@${creator} suspended for 48h (2nd violation)`);}
  }
  showToast(action==="confirm"?"Content removed.":"Flag dismissed.");renderApp();
}
function markDisputed(oid){
  createModal(`
    <h2 style="font-family:'Fraunces',serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;">Mark as Disputed</h2>

    <div class="form-group"><label class="form-label">Dispute note</label><textarea id="dispute-note" style="height:80px;">Some claims in this article have not been independently verified.</textarea></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-amber" onclick="confirmDispute('${oid}')">Apply Dispute Label</button>
      <button class="btn btn-secondary" onclick="closeModal()">${t("cancel")}</button>
    </div>
  `);
}
function confirmDispute(oid){
  const note=document.getElementById("dispute-note")?.value.trim();
  if(!note)return showToast("Write a note for readers");
  const post=STATE.posts.find(p=>p.oid===oid);if(post){post.disputed=true;post.disputeNote=note;}
  closeModal();saveState();showToast("Content marked as disputed.","success");renderApp();
}

function closeModal(){const m=document.getElementById("modal-overlay");if(m)m.remove();}
function createModal(html){
  let m=document.getElementById("modal-overlay");if(m)m.remove();
  m=document.createElement("div");m.id="modal-overlay";m.className="overlay";
  m.innerHTML=`<div class="modal">${html}</div>`;
  m.addEventListener("click",e=>{if(e.target===m)closeModal();});
  document.body.appendChild(m);
}

function openCreateModal(defaultType="Article"){
  if(!STATE.user)return navigate("landing");
  const types=(can(STATE.user,"postArticle")?["Article"]:[]).concat(can(STATE.user,"createForum")?["Forum Post"]:[]);
  if(!types.length)return showToast("Your account cannot create content");

  createModal(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;"><h2 style="font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--text);">Create</h2><button onclick="closeModal()" style="background:transparent;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;">✕</button></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">${types.map(t=>`<button id="ct-${t.replace(" ","")}" onclick="crSetType('${t}')" style="padding:6px 14px;border-radius:6px;border:1px solid ${_type===t?"var(--amber)":"var(--border)"};background:${_type===t?"var(--amber-faint)":"transparent"};color:${_type===t?"var(--amber)":"var(--text-muted)"};cursor:pointer;font-size:13px;font-weight:500;">${t}</button>`).join("")}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:2px;">
      <div style="flex:1;min-width:160px;"><label class="form-label">Title</label><input id="cr-title" placeholder="A compelling title…"></div>
      <div style="width:140px;"><label class="form-label">Category</label><select id="cr-cat">${CATS.filter(c=>c.id!=="all").map(c=>`<option value="${c.id}">${c.l}</option>`).join("")}</select></div>
      <div style="width:120px;"><label class="form-label">Language</label><select id="cr-lang">${LANGS.map(l=>`<option value="${l.id}">${l.l}</option>`).join("")}</select></div>
    </div>
    <label class="form-label" style="display:flex;justify-content:space-between;"><span>Content</span><span id="cr-wc" style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-dim);">0 words</span></label>
    <div class="rich-toolbar">${[["B","Bold","**","**"],["I","Italic","*","*"],["H2","Heading","## ",""],["•","Bullet","- ",""],["\"","Quote","> ",""],["</>","Code","\`","\`"]].map(([l,t,b,a])=>`<button class="tb-btn" title="${t}" onclick="crWrap('${b}','${a}')">${l}</button>`).join("")}</div>
    <textarea id="cr-content" class="rich-ta" placeholder="Your ideas, analysis, or questions…" style="height:140px;margin-bottom:0;" oninput="document.getElementById('cr-wc').textContent=this.value.trim().split(/\\s+/).filter(Boolean).length+' words'"></textarea>
    <div class="form-group" style="margin-top:10px;"><label class="form-label">Tags</label><input id="cr-tags" placeholder="technology, finance, culture…"></div>
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button class="btn btn-primary" onclick="submitCreate('published')">Publish</button>
      <button class="btn btn-amber" onclick="submitCreate('draft')">Save Draft</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
    <p style="font-size:11px;color:var(--text-dim);margin-top:10px;">Drafts are private. Publish when ready.</p>
  `);
  window._crType=_type;
}
function crSetType(t){window._crType=t;["Article","Forum Post"].forEach(x=>{const btn=document.getElementById(`ct-${x.replace(" ","")}`);if(btn){btn.style.borderColor=x===t?"var(--amber)":"var(--border)";btn.style.background=x===t?"var(--amber-faint)":"transparent";btn.style.color=x===t?"var(--amber)":"var(--text-muted)";}});}
function crWrap(before,after){const ta=document.getElementById("cr-content");if(!ta)return;const s=ta.selectionStart,e=ta.selectionEnd;const sel=ta.value.slice(s,e)||"text";if(after){ta.value=ta.value.slice(0,s)+before+sel+after+ta.value.slice(e);}else{const ls=ta.value.lastIndexOf("\n",s-1)+1;ta.value=ta.value.slice(0,ls)+before+ta.value.slice(ls);}ta.focus();}
function submitCreate(status){
  const type=window._crType||"Article";
  const title=document.getElementById("cr-title")?.value.trim();
  const content=document.getElementById("cr-content")?.value.trim();
  const cat=document.getElementById("cr-cat")?.value||"technology";
  const lang=document.getElementById("cr-lang")?.value||"en";
  const tags=document.getElementById("cr-tags")?.value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
  if(!title)return showToast("Title required");
  if(status==="published"&&!content)return showToast("Content required to publish");
  const np={oid:uid(),creator:STATE.user.username,otype:type,status,category:cat,language:lang,tags:tags||[],seriesId:null,title,content:content||"",pollOptions:null,nlikes:0,ncomments:0,views:0,timestamp:new Date().toISOString(),flagged:false,likedBy:[],sharedBy:[],disputed:false,disputeNote:""};
  STATE.posts.unshift(np);closeModal();showToast(status==="draft"?"Saved to Drafts.":"Published!","success");
  if(status==="published"){const myPub=STATE.posts.filter(p=>p.creator===STATE.user.username&&p.status==="published").length;if(myPub===1&&STATE.user.referredBy){const u=STATE.users[STATE.user.username];u.foundingCreator=true;STATE.user.foundingCreator=true;showToast("🎉 You've earned your Founding Creator badge!","success");}}
  navigate(type==="Article"?"articles":"forum");
}

function openEditModal(oid){
  const post=STATE.posts.find(p=>p.oid===oid);if(!post)return;
  createModal(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;"><div style="display:flex;align-items:center;gap:10px;"><h2 style="font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--text);">Edit Post</h2><span class="badge badge-${post.status}">${post.status.toUpperCase()}</span></div><button onclick="closeModal()" style="background:transparent;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;">✕</button></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:2px;">
      <div style="flex:1;min-width:160px;"><label class="form-label">Title</label><input id="ed-title" value="${escHtml(post.title)}"></div>
      <div style="width:140px;"><label class="form-label">Category</label><select id="ed-cat">${CATS.filter(c=>c.id!=="all").map(c=>`<option value="${c.id}"${post.category===c.id?" selected":""}>${c.l}</option>`).join("")}</select></div>
    </div>
    <label class="form-label">Content</label>
    <div class="rich-toolbar">${[["B","**","**"],["I","*","*"],["H2","## ",""],["•","- ",""]].map(([l,b,a])=>`<button class="tb-btn" onclick="edWrap('${b}','${a}')">${l}</button>`).join("")}</div>
    <textarea id="ed-content" class="rich-ta" style="height:140px;">${escHtml(post.content)}</textarea>
    <div class="form-group" style="margin-top:10px;"><label class="form-label">Tags</label><input id="ed-tags" value="${escHtml(post.tags.join(", "))}"></div>
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button class="btn btn-primary" onclick="saveEdit('${oid}')">Save Changes</button>

      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  `);
}
function edWrap(b,a){const ta=document.getElementById("ed-content");if(!ta)return;const s=ta.selectionStart,e=ta.selectionEnd;const sel=ta.value.slice(s,e)||"text";if(a){ta.value=ta.value.slice(0,s)+b+sel+a+ta.value.slice(e);}else{const ls=ta.value.lastIndexOf("\n",s-1)+1;ta.value=ta.value.slice(0,ls)+b+ta.value.slice(ls);}ta.focus();}
function saveEdit(oid){
  const post=STATE.posts.find(p=>p.oid===oid);if(!post)return;
  const title=document.getElementById("ed-title")?.value.trim();
  if(!title)return showToast("Title required");
  post.title=title;
  post.content=document.getElementById("ed-content")?.value||post.content;
  post.category=document.getElementById("ed-cat")?.value||post.category;
  post.tags=document.getElementById("ed-tags")?.value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean)||post.tags;
  closeModal();showToast("Post updated.","success");renderApp();
}
function saveEditAndPublish(oid){saveEdit(oid);publishPost(oid);}

function openFlagModal(oid){
  if(!STATE.user)return navigate("landing");
  createModal(`
    <h2 style="font-family:'Fraunces',serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;">Report Content</h2>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">${FLAG_REASONS.map(r=>`<button onclick="selectFlagReason('${r}')" id="fr-${r.replace(/\s/g,"-")}" style="padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:12px;font-weight:500;cursor:pointer;text-align:left;">${r}</button>`).join("")}</div>

      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>

  `);
  window._flagOid=oid;window._flagReason=null;
}
function selectFlagReason(r){
  window._flagReason=r;
  FLAG_REASONS.forEach(x=>{const btn=document.getElementById(`fr-${x.replace(/\s/g,"-")}`);if(btn){btn.style.borderColor=x===r?"var(--red)":"var(--border)";btn.style.background=x===r?"var(--red-tint)":"transparent";btn.style.color=x===r?"var(--red)":"var(--text-muted)";}});
}
function submitFlag(oid){
  if(!window._flagReason)return showToast("Select a reason");
  const notes=document.getElementById("flag-notes")?.value.trim()||"";
  const post=STATE.posts.find(p=>p.oid===oid);
  STATE.flags.unshift({id:uid(),reporter:STATE.user.username,entityCreator:post?.creator||"",entityType:"post",entityId:oid,reason:window._flagReason,notes,status:"pending",ts:new Date().toISOString()});
  closeModal();showToast("Content reported. Our team will review within 24 hours.");
}
